[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dragons-dogma-dark-mcp"
version = "0.2.0"
description = "Thingolus's local MCP development toolkit for Dragon's Dogma: Dark Arisen"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Thingolus"}]
dependencies = [
  "mcp==2.3.0",
  "capstone==5.0.9",
  "pefile==2024.8.26",
  "psutil==7.2.2",
  "portalocker==4.4.1",
]

[project.optional-dependencies]
live = ["frida==17.19.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.scripts]
ddda-mcp = "ddda_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ddda_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
