name: Validate and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.4
          uv sync --locked
      - name: Style, diagnostics and compatibility regression
        run: |
          uv run --locked ruff check src tests scripts
          uv run --locked ruff format --check src tests scripts
          uv run --locked pytest -q --junitxml=artifacts/ci-tests.xml
      - name: Build and audit packages
        run: |
          uv build
          uv run --locked python scripts/release_package.py
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          uv venv .release-test
          if [ "$RUNNER_OS" = "Windows" ]; then py=.release-test/Scripts/python.exe; else py=.release-test/bin/python; fi
          uv pip install --python "$py" dist/release/*.whl
          "$py" -I -m ddda_mcp --version
      - name: Store test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tests-${{ matrix.os }}
          path: artifacts/ci-tests.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Store audited release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: package-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: package-windows-latest
          path: release
      - name: Verify checksums and create draft
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file INSTALL.md
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" ./* --clobber
